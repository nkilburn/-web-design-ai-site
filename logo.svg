  <rect width="100%" height="100%" fill="transparent" />
  <text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" font-family="Inter, system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="84" font-weight="700">
    <tspan fill="#9aa5b5">north</tspan><tspan fill="#101010">ninth</tspan>
  </text>
</svg>
